# Seção Sobre Mim
about:
  title: "Sobre Mim"
  section_tag: "Minha Jornada"
  quote:
    text: "É preciso mais do que inteligência para agir de forma inteligente."
    author: "Fiódor Dostoiévski"
  paragraphs:
    - "Sou estudante de Engenharia de Software na Universidade Católica de Brasília e atuo no mercado como estagiário e pesquisador. Meu foco diário está em construir uma base consistente de engenharia de software, aprendendo na prática através do desenvolvimento de microsserviços e da vivência com equipes de produto e tecnologia."
    - "Tenho grande interesse em pesquisa aplicada, explorando áreas como Agentic Development e o uso de inteligência artificial aplicada à saúde. Busco evoluir continuamente de forma humilde, combinando estudos teóricos com soluções práticas, código limpo e vontade constante de colaborar."

