# Seção Sobre Mim
about:
  title: "Sobre Mim"
  section_tag: "Minha Jornada"
  quote:
    text: "É preciso mais do que inteligência para agir de forma inteligente."
    author: "Fiódor Dostoiévski"
  paragraphs:
    - "Minha trajetória na tecnologia é guiada pela transição fluida entre arquitetura de software, visão de negócios e o ecossistema open-source. Acredito que o verdadeiro impacto da engenharia não está apenas na elegância do código, mas na capacidade de traduzir objetivos estratégicos em sistemas escaláveis, robustos e centrados no ser humano."
    - "Com base sólida em desenvolvimento backend no ecossistema Java (Spring Boot, Spring Cloud, Maven) e imersão ativa em pesquisa de Inteligência Artificial e Deep Learning, busco continuamente conectar a inovação científica à solução de problemas do mundo real. Na interseção entre tecnologia e produto, atuo com foco em valor contínuo, boas práticas arquiteturais e colaboração em comunidade."

